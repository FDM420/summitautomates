# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure
#
# Build/runtime environment variables for the Next.js app.
# NEXT_PUBLIC_* vars are inlined into the client bundle at BUILD time.

env:
  - variable: NEXT_PUBLIC_CALENDAR_URL
    value: https://calendly.com/admin-fdm-summit-systems/30min
    availability:
      - BUILD
      - RUNTIME

  # --- WhatsApp Cloud API webhook ---
  # Verify token: shared string Meta echoes back during webhook verification.
  # Low-sensitivity, kept inline so verification works without extra setup.
  - variable: WHATSAPP_VERIFY_TOKEN
    value: summit_wa_0f662d5280c3be8a3661b64d32fbbe2c38f638b0
    availability:
      - RUNTIME

  # Phone Number ID is an identifier, not a secret (harmless without the access
  # token), so it is kept inline. From WhatsApp Manager for +92 343 1111003.
  - variable: WHATSAPP_PHONE_NUMBER_ID
    value: "1317996351390422"
    availability:
      - RUNTIME

  # Sensitive values — stored in Cloud Secret Manager, referenced by name.
  - variable: WHATSAPP_APP_SECRET
    secret: whatsapp-app-secret
    availability:
      - RUNTIME
  - variable: WHATSAPP_ACCESS_TOKEN
    secret: whatsapp-access-token
    availability:
      - RUNTIME

  # AI replies use this key (webhook falls back to templated replies without it).
  - variable: OPENAI_API_KEY
    secret: openai-api-key
    availability:
      - RUNTIME

  # CRM database (Railway Postgres, public proxy). Used by the /admin CRM and the
  # WhatsApp webhook to persist contacts, leads, and the activity timeline.
  - variable: DATABASE_URL
    secret: database-url
    availability:
      - RUNTIME
